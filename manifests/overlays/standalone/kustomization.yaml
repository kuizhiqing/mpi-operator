apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- namespace.yaml
namespace: kube-system
commonLabels:
  kustomize.component: launch-operator
  app: launch-operator
  app.kubernetes.io/name: launch-operator
  app.kubernetes.io/component: mpijob
images:
- name: mpioperator/mpi-operator
  newName: mpioperator/mpi-operator
  newTag: master
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: launch-operator
    path: ./patch.yaml
