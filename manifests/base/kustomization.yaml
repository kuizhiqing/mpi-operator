  app: resilient-training-operator
  app.kubernetes.io/name: resilient-training-operator
  app.kubernetes.io/component: resilientjob
images:
- name: kuizhiqing/resilient-training-operator
  newName: kuizhiqing/resilient-training-operator
  newTag: latest
