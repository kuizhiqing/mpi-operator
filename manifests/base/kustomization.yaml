apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubeflow
resources:
- cluster-role-binding.yaml
- cluster-role.yaml
- kubeflow.org_resilientjobs.yaml
- deployment.yaml
- service-account.yaml
commonLabels:
