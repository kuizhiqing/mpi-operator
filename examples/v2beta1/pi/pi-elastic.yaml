apiVersion: kubeflow.org/v2beta1
kind: ResilientJob
metadata:
  name: pi-elastic
spec:
  slotsPerWorker: 1
  runPolicy:
    cleanPodPolicy: Running
    ttlSecondsAfterFinished: 60
  sshAuthMountPath: /home/mpiuser/.ssh
  # Elastic, fault-tolerant execution: failed/lost worker pods are restarted and
  # recreated so the job survives transient failures. Enabled by default; shown
  # here explicitly.
  elasticPolicy:
    enabled: true
  # Auto-recovery: the launcher runs the fault-tolerant mpirun wrapper that
  # barriers on peers and restarts the user command on failure. Disabled unless
  # this block is present.
  recoverPolicy:
    enabled: true
  # Run a worker process inside the launcher pod (launcher joins the hostfile).
  launcherAsWorker: true
  # Pause reconciliation without deleting pods. false = reconcile normally.
  frozen: false
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          containers:
          - image: mpioperator/mpi-pi:openmpi
            name: mpi-launcher
            securityContext:
              runAsUser: 1000
            command:
            - mpirun
            args:
            - -n
            - "2"
            - /home/mpiuser/pi
            resources:
              limits:
                cpu: 1
                memory: 1Gi
    Worker:
      replicas: 2
      template:
        spec:
          containers:
          - image: mpioperator/mpi-pi:openmpi
            name: mpi-worker
            securityContext:
              runAsUser: 1000
            command:
            - /usr/sbin/sshd
            args:
            - -De
            - -f
            - /home/mpiuser/.sshd_config
            resources:
              limits:
                cpu: 1
                memory: 1Gi
